# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  unit-sim:
    needs: lint
    uses: ./.github/workflows/unit_sim.yml

  integration-sim:
    needs: unit-sim
    uses: ./.github/workflows/integration_sim.yml
