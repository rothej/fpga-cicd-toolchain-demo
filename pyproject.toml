[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-cicd-toolchain-demo"
version = "0.1.0-dev"
description = "Verible, Verilator, cocotb, and pyuvm CI/CD toolchain demo for 5G NR DUT written in SystemVerilog RTL."
authors = [{name = "Joshua Rothe", email = "21348884+rothej@users.noreply.github.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["fpga", "systemverilog", "verilator", "cocotb", "verible", "pyuvm", "rtl", "5g", "nr"]
dependencies = [
    "cocotb>=2.0.0",
    "cocotb-tools>=0.1",
    "pyuvm>=3.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "ruff>=0.5",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/rothej/fpga-cicd-toolchain-demo"
Portfolio = "https://joshrothe.us"

[tool.setuptools.packages.find]
where = ["."]
include = ["verif*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["verif"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
files = ["verif"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]  # pyuvm/cocotb ship no stubs

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra -q --strict-markers"
testpaths = ["verif"]
pythonpath = ["verif", "verif/common"]

[[tool.mypy.overrides]]
module = ["pyuvm", "pyuvm.*", "cocotb", "cocotb.*"]
ignore_missing_imports = true

# Again, pyuvm ships no stubs
[[tool.mypy.overrides]]
module = ["verif.*", "verif.*.*"]
warn_return_any = false
disallow_untyped_defs = false
