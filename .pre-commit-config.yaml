# .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-ast
      - id: check-builtin-literals
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-docstring-first

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check   # linter + isort; --fix applies safe autofixes
        args: ['--fix']
      - id: ruff-format  # formatter (black replacement)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: ['--config-file=pyproject.toml']
        pass_filenames: false
        additional_dependencies:
          - pytest
          - pyuvm
          - cocotb

  - repo: local
    hooks:
      - id: verible-verilog-format
        name: Verible Verilog Formatter
        description: Auto-format SystemVerilog/Verilog files
        entry: .tools/verible/bin/verible-verilog-format
        language: system
        files: '\.sv$|\.v$'
        args:
          - '--inplace'
          - '--indentation_spaces=4'
          - '--column_limit=100'

      - id: verible-verilog-lint
        name: Verible Verilog Linter
        description: Lint SystemVerilog/Verilog files per systemverilog.io style
        entry: .tools/verible/bin/verible-verilog-lint
        language: system
        files: '\.sv$|\.v$'
        args: ['--rules_config=.verible-lint.rules']

default_stages: [pre-commit, pre-push]
